[task]
id = "t02-stability-edge-ws2"
blueprint = "t02-stability-edge"
world_seed = 2
title = "Stability of a 7B production run planned from small-scale sweeps"
cards = ["C1", "C2", "C4", "C10"]
obstacles = ["O3", "O5", "O9"]
claim = "bound a quantity the lab only observes censored (a stability edge that never binds in the lab), choose the experiment that makes the bound tightest, and state exactly what remains unknown"
n_items = 7

[agent]
timeout_sec = 7200

[environment]
app_dir = "environment/app"
lab_service = "scalelab.lab_server (holds hidden/world.json; the agent reaches it only through bin/lab)"

[verifier]
command = "python3 tests/grade.py <answers.json>"
