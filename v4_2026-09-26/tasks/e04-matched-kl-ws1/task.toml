[task]
id = "e04-matched-kl-ws1"
blueprint = "e04-matched-kl"
lab = "rllab"
world_seed = 1
title = "Matched-KL ship review: pre-register the experiment that decides best-of-n against PPO"
cards = ["R1", "R2", "R4"]
obstacles = ["O13", "O4", "O1", "O11"]
claim = "separate what a proxy reward can settle from what only a gold evaluation can, put two methods at the same distance from the initial policy when neither knob states that distance, and commit to a decision rule that holds in every world the disclosed evidence leaves open"
n_items = 4
kinds = ["decision", "point", "prereg"]

[agent]
timeout_sec = 7200

[environment]
app_dir = "environment/app"
lab_service = "scalelab.lab_server (holds hidden/world.json; the agent reaches it only through bin/lab)"

[verifier]
command = "python3 tests/grade.py <answers.json> [lab_ledger.jsonl]"
