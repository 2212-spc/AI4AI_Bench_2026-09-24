[task]
id = "e01-release-gap-ws2"
blueprint = "e01-release-gap"
lab = "evallab"
world_seed = 2
title = "Release gap: the denominator, the contamination, the error bar and the weighting of one eval report"
cards = ["E1", "E2", "E3", "E6", "E7", "E8"]
obstacles = ["O4", "O16", "O10", "O5"]
claim = "hold an evaluation report to the convention it will be released under: separate the reported denominator from the quantity of interest, measure contamination instead of trusting a detector score, price the between-call variance a binomial error bar omits, and report a weighting-dependent comparison as undetermined"
n_items = 5
kinds = ["point", "set", "verdict"]

[agent]
timeout_sec = 7200

[environment]
app_dir = "environment/app"
lab_service = "scalelab.lab_server (holds hidden/world.json; the agent reaches it only through bin/lab)"

[verifier]
command = "python3 tests/grade.py <answers.json> [lab_ledger.jsonl]"
